# PostgreSQL for the coordinator.
#
# Concepts:
#  - StatefulSet: like a Deployment but pods get stable names (hearts-db-0) and
#    stable storage. The right tool for databases.
#  - volumeClaimTemplates: the StatefulSet creates one PersistentVolumeClaim per pod
#    (data-hearts-db-0) from the `local-path` StorageClass, i.e. a directory on
#    one node's disk. The pod is effectively pinned to that node; if the node
#    dies the data is unavailable until it returns. Fine for a homelab.
#  - Sidecar: a second container in the same pod (postgres-exporter) that
#    shares localhost with Postgres and exposes Prometheus metrics on :9187.
#  - Probes: readiness gates Service traffic; liveness restarts a stuck container.
#  - Service: stable DNS name + virtual IP (hearts-db.hearts.svc:5432).
# The Secret `hearts-db` (keys POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB) is
# generated by the overlay's secretGenerator from deploy/overlays/homelab/db.env.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hearts-db
  namespace: hearts
  labels:
    app.kubernetes.io/name: hearts-db
    app.kubernetes.io/part-of: hearts
spec:
  serviceName: hearts-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hearts-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hearts-db
        app.kubernetes.io/part-of: hearts
    spec:
      containers:
        - name: postgres
          image: postgres:18.4
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: hearts-db
          env:
            # Postgres refuses to init in a mount root (lost+found etc.), so use a subdirectory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
          ports:
            - name: metrics
              containerPort: 9187
          env:
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: hearts-db, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: hearts-db, key: POSTGRES_PASSWORD}}
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: hearts-db, key: POSTGRES_DB}}
            # $(VAR) expands earlier env entries; containers in a pod share localhost.
            - name: DATA_SOURCE_NAME
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@localhost:5432/$(POSTGRES_DB)?sslmode=disable"
          readinessProbe:
            httpGet: {path: /, port: metrics}
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: hearts-db
  namespace: hearts
  labels:
    app.kubernetes.io/name: hearts-db
    app.kubernetes.io/part-of: hearts
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hearts-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
    - name: metrics
      port: 9187
      targetPort: metrics
