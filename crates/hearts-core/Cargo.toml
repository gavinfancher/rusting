[package]
name = "hearts-core"
description = "Pure Hearts game engine: cards, rules, bots, tournaments, PIMC advisor. No I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# The default libtest bench harness rejects criterion flags like --quick.
bench = false

[dependencies]
serde = { workspace = true }
rayon = { workspace = true }

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.12.0"
serde_json = { workspace = true }

[[bench]]
name = "engine"
harness = false
